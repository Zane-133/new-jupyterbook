# Paths on Neurodesk. Every chapter reads them through common.py; no paths in the chapters.
paths:
  data:        ~/neurodesktop-storage/neurodesk_upload                          # old/  new/  freesurfer/
  license:     ~/neurodesktop-storage/neurodesk_upload/freesurfer/license.txt
  results:     ~/neurodesktop-storage/lfbook/results                            # everything the book computes
  work:        ~/neurodesktop-storage/lfbook/work                               # staging folders (symlinks)
  # WMH-SynthSeg code (commit 2bf9a42, patched in Chapter 03) and model; used by Chapter 03
  wmh_code:    ~/neurodesktop-storage/lfbook/wmh
  wmh_model:   ~/neurodesktop-storage/lfbook/wmh_model/WMH-SynthSeg_v10_231110.pth

freesurfer_module: freesurfer/8.0.0

# 'all', or a list of subjects for a test run, e.g. [sub-0011].
# A test run writes to results_test/ instead of results/.
subjects: all
