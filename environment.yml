# Python environment for the whole book (notebook kernel + WMH-SynthSeg on GPU).
# Created by setup.sh at ~/conda-envs/lfbook.
name: lfbook
channels:
  - conda-forge
dependencies:
  - python=3.11
  - ipykernel
  - numpy
  - pandas
  - scipy
  - nibabel
  - matplotlib
  - nilearn
  - h5py
  - pyyaml
  - jupytext
  - pip
# jupyter-book and torch are installed with pip by setup.sh (torch is several GB)
