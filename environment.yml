# Python environment for the whole book (notebook kernel + WMH-SynthSeg on GPU).
# Created by setup.sh at ~/conda-envs/lfbook.
name: lfbook
channels:
  - conda-forge
dependencies:
  - python=3.11
  - ipykernel
  - numpy
  - pandas
  - scipy
  - nibabel
  - matplotlib
  - nilearn
  - h5py
  - pyyaml
  - jupytext
  - pip
  - pip:
      - "jupyter-book<2"      # v2 drops _config.yml / _toc.yml
      - torch                 # PyPI Linux wheel includes CUDA
