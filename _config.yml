title: Metrics for AI Image Enhancement — Volume as a Starting Point
author: Guokai Zhen
copyright: "2026"
logo: ""

only_build_toc_files: true

# .md files are the source; .ipynb copies made for interactive debugging are not built
exclude_patterns:
  - "*.ipynb"
  - _build
  - README.md

execute:
  # force: every chapter runs on every build; finished computations are skipped inside the chapters
  execute_notebooks: force
  # Appendix A needs Colab and a GPU: shown, not run (pattern matches the full path)
  exclude_patterns:
    - "*appendix_wmh_colab*"
  # no time limit: segmentation and registration take hours
  timeout: -1
  # stop on the first error instead of producing a book with wrong numbers
  allow_errors: false

parse:
  myst_enable_extensions:
    - dollarmath
    - colon_fence
    - deflist

html:
  use_issues_button: false
  use_repository_button: false

sphinx:
  config:
    numfig: true
